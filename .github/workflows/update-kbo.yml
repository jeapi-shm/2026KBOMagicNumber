name: Update KBO data

on:
  schedule:
    # 매일 00:10 KST (15:10 UTC)
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: pip install requests beautifulsoup4
      - name: Update standings and matchups
        run: python scripts/update_kbo.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- index.html; then
            echo "KBO data is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update KBO data"
          git push
